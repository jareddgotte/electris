name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The review reads the diff through the GitHub API (`gh pr diff`), never
          # from local history, so a shallow checkout is sufficient.
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Deliberately does NOT use code-review@claude-code-plugins. That plugin
          # spawns background agents and ends its turn to wait for them, which works
          # interactively but not here: in the headless SDK, end_turn is completion,
          # so the run terminates mid-review and posts nothing. See the PR that
          # introduced this change for the captured evidence.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request using the steps below, in order.

            CRITICAL EXECUTION CONSTRAINT. You are running headless in CI. There
            is no interactive session, so ending your turn ends the whole run.
            Never call ScheduleWakeup. Never dispatch an agent with
            run_in_background set to true. Every agent you dispatch must be
            synchronous, so its result returns to you within the same turn. Do
            not end your turn while any agent is outstanding or any confirmed
            finding is still unposted.

            1. Fetch the diff with `gh pr diff`, read AGENTS.md, and list the
               pull request's existing review threads. Treat AGENTS.md as
               binding: it documents this repository's Electron boundary, the
               main-process and renderer responsibilities, the current
               architecture guidance in AGENTS.md, the current gameplay and
               high-score invariants, the canonical npm workflow, and the
               requirement to keep generated app bundles out of version control.

            2. Handle review threads before new findings. For each thread this bot
               opened: if it is genuinely addressed, reply with what changed --
               never write "Resolving", "Resolved", or any other word claiming
               the thread's state in that reply, since a comment is not a state
               transition and resolution is proven only by the verified
               procedure below. If someone replied with a disagreement or
               question, answer on-thread, engage with the substance, and only
               route it through the same verified procedure once the substance
               is settled; if it is not settled, explain why and leave it open.
               If a thread is still unaddressed, leave it open and do not repost
               the same finding as a new comment. Never resolve a thread a human
               opened, and never resolve a thread merely because it was replied
               to or is disputed. Never treat `isOutdated` or a reply as proof
               the issue is fixed.

               Verified resolution procedure, once a bot-opened thread's
               substance is genuinely settled: invoke the GraphQL
               `resolveReviewThread` mutation as its own standalone tool call --
               never joined to the reply or to any other command. Inspect the
               response and require `data.resolveReviewThread.thread.isResolved
               == true`. If the call is denied, errors, or returns
               `isResolved: false`, retry it exactly once, again as a standalone
               call. Whether or not the mutation reported success, re-run the
               read-only thread query from step 1 and require actual
               `isResolved == true` for that thread before treating it as
               resolved or continuing. A successful-looking mutation response is
               not sufficient by itself; only this follow-up query is. If the
               mutation and its one retry both fail, or the follow-up query
               still shows `isResolved: false`, leave the thread open, do not
               claim resolution anywhere, and state the exact failure (the
               error, the denial, or the false result) in the final summary.

            3. Dispatch exactly two synchronous general-purpose review agents in
               a single message so they run in parallel. Give each the same
               instructions: independently review this PR for correctness
               problems -- logic errors, broken invariants, unsafe Electron
               boundary changes, broken gameplay or high-score behavior,
               packaging mistakes, workflow regressions, edge cases, and behavior
               contradicting a function's name, its documentation, or the PR's
               stated intent. Tell each to trace the code by hand and report, for
               every candidate issue, the file and line, what goes wrong, and a
               concrete input that triggers it. Tell them to ignore formatting
               handled by `npm run lint`, and to report nothing rather than pad
               the list.

            4. Wait for both agents to return. Then validate their findings
               yourself against the real code. Keep a finding only if you can
               trace the specific failure it claims. Discard anything
               speculative, stylistic, already correct, or out of scope for the
               diff. Where the two agents agree, that is corroboration, not
               proof -- verify anyway. Prefer discarding a doubtful finding over
               posting a false positive.

            5. Post each surviving finding as an inline comment on the relevant
               line using mcp__github_inline_comment__create_inline_comment,
               including a committable suggestion where a concrete fix is clear.
               Do not post duplicate findings that a prior review thread already
               covers.

            6. End with a brief summary naming what you posted, what you
               resolved, what you left open, and what you investigated and
               rejected. If nothing survived validation, post no comments and say
               so.
          # --allowedTools is exclusive: anything not listed is denied, and in CI a
          # denial is silent -- the job still reports success with no review posted.
          # create_inline_comment is the action's purpose-built posting tool; without
          # it the review hand-rolls `gh api ... -F line=N`, which is far more fragile.
          # Bash is scoped to the read-only inspection commands the review needs.
          # Agent/Task must be listed or the parallel review agents are denied.
          # Both names are included because the allowlist is exclusive and a wrong
          # name fails silently; the surplus one is simply unused.
          # ScheduleWakeup is deliberately absent -- it is interactive-only and
          # calling it is what stranded the plugin mid-review.
          claude_args: '--allowedTools "Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-tree:*),Read,Glob,Grep"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
