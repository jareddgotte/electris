name: Pull request validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use declared Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Use declared npm version
        run: npm install --global npm@11.19.0

      - name: Install frozen dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run deterministic tests
        run: npm test

      - name: Allow the smoke Electron binary to use unprivileged user namespaces
        # ubuntu-latest restricts unprivileged user namespace creation via AppArmor by
        # default, which aborts Electron's own chrome-sandbox before it can enforce
        # anything, independent of chrome-sandbox's SUID bit. This grants that one
        # binary path the same "userns" permission actions/runner-images documents for
        # Chromium-based tools, without touching, chmodding, or disabling
        # chrome-sandbox itself, so the real sandbox still initializes and enforces.
        run: |
          cat <<EOF | sudo tee /etc/apparmor.d/electris-electron-smoke
          abi <abi/4.0>,
          include <tunables/global>

          profile electris-electron-smoke ${{ github.workspace }}/node_modules/electron/dist/electron flags=(unconfined) {
            userns,
            include if exists <local/electris-electron-smoke>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/electris-electron-smoke

      - name: Run Electron security smoke suite
        run: npm run smoke

      - name: Check documentation
        run: npm run docs:check

      - name: Build production bundles from a clean state
        run: npm run build
